<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dream Travelers</title>
    <link rel="stylesheet" href="travel.css?v=2">
  </head>
  <body>
    <nav class="navbar" aria-label="Main navigation">
      <a href="travel index.html" class="logo">
        <img src="travel.images/DT logo.png" alt="Dream Travelers" class="logo-image">
      </a>
      <ul class="nav-links">
        <li><a href="travel index.html">Home</a></li>
        <li><a href="travel destination.html">Destinations</a></li>
        <li><a href="travel packages.html">Packages</a></li>
        <li><a href="travel about.html">About us</a></li>
        <li><a href="travel contact.html">Contact</a></li>
        <li><a class="login" href="travel login.html" aria-current="page">Login</a></li>
      </ul>
    </nav>
    <main>
      <section class="hero-login" aria-labelledby="login-heading">
        <div class="login-container">
          <h2 id="login-heading">Welcome</h2>
          <p>Sign in to continue your journey with us.</p>
          <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="username" required>
            <label for="password">Password</label>
            <div class="login-options"></div>
            <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
            <p id="error-msg" class="form-message" role="status" aria-live="polite"></p>
            <a href="#" class="forgot-password">Forgot Password?</a>
            <button type="submit">Login</button>
          </form>
          <p class="signup-note">Enter your email and any password to continue. This demo does not verify accounts.</p>
        </div>
      </section>
    </main>
    <script src="js/login.js" defer></script>
  </body>
</html>
